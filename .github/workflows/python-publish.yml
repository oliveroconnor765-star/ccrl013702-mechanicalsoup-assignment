# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        # Fetch the full history so the released commit can be verified
        # to be contained in the main branch (see tools/check_release.py).
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build packaging
    - name: Build package
      run: python -m build
    - name: Validate release before publishing
      # Block publishing unless the release tag, the source version, the
      # built wheel/sdist metadata, and the released commit are all
      # consistent and the commit is contained in main. Fails closed.
      run: python tools/check_release.py
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
